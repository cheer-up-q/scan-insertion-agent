[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-insertion-agent"
version = "0.1.0"
description = "LLM-based autonomous Scan Insertion agent for EDA Elite Challenge 2026"
requires-python = ">=3.9"
dependencies = [
  "pydantic>=2.0,<3",
  "PyYAML>=6.0",
  "pypdf>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
